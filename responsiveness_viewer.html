<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMM 2027 • Interactive Responsiveness & Device Matrix Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #090c13;
      --bg-panel: #111724;
      --bg-surface: #182234;
      --border-color: rgba(255, 255, 255, 0.12);
      --primary-orange: #f95700;
      --primary-emerald: #10b981;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Control Bar */
    .top-toolbar {
      background: var(--bg-panel);
      border-bottom: 2px solid var(--border-color);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-tag {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .brand-tag span {
      color: var(--primary-orange);
    }

    .badge-live {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 800;
      background: rgba(16, 185, 129, 0.15);
      color: var(--primary-emerald);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .preset-selector, .page-selector {
      background: var(--bg-surface);
      color: #fff;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    .preset-selector:focus, .page-selector:focus {
      border-color: var(--primary-orange);
      box-shadow: 0 0 0 2px rgba(249, 87, 0, 0.25);
    }

    .tool-btn {
      background: var(--bg-surface);
      color: #fff;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #fff;
    }

    .tool-btn.primary {
      background: var(--primary-orange);
      border-color: var(--primary-orange);
      color: #fff;
    }

    .tool-btn.primary:hover {
      background: #e04e00;
      box-shadow: 0 0 14px rgba(249, 87, 0, 0.4);
    }

    .viewport-stat {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary-orange);
      background: rgba(249, 87, 0, 0.1);
      border: 1px solid rgba(249, 87, 0, 0.3);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
    }

    /* Main Viewport Stage */
    .stage-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      overflow: auto;
      background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Device Chassis Frame */
    .device-frame-wrapper {
      position: relative;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 12px #1e2430;
      border-radius: 36px;
      overflow: hidden;
      background: #000;
      margin-bottom: 2rem;
    }

    .device-frame-wrapper.desktop-mode {
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 8px #2a3446;
    }

    iframe#previewFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: block;
    }

    /* Diagnostic Results Modal / Drawer */
    .audit-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.5rem;
    }

    .audit-overlay.active {
      display: flex;
    }

    .audit-modal {
      background: var(--bg-panel);
      border: 2px solid var(--border-color);
      border-radius: 20px;
      max-width: 860px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }

    .audit-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1.5px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .audit-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .audit-body {
      padding: 1.5rem;
      overflow-y: auto;
      flex: 1;
    }

    .audit-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }

    .audit-table th, .audit-table td {
      padding: 0.65rem 0.85rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .audit-table th {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-weight: 700;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.72rem;
    }

    .status-badge.pass {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .status-badge.fail {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Viewport Controls -->
  <header class="top-toolbar">
    <div class="brand-group">
      <div class="brand-tag">TMM 2027<span>.</span> RESPONSIVE MATRIX</div>
      <div class="badge-live">Live Inspector</div>
    </div>

    <div class="controls-row">
      <!-- Target Page Switcher -->
      <select id="pageSelect" class="page-selector" onchange="changePage(this.value)">
        <option value="index.html">📄 index.html (Master Training Plan)</option>
        <option value="simulator.html">📱 simulator.html (Swiss Industrial Companion)</option>
      </select>

      <!-- Preset Device Viewport Switcher -->
      <select id="deviceSelect" class="preset-selector" onchange="applyDevicePreset(this.value)">
        <optgroup label="Mobile Devices">
          <option value="320x568" data-mode="mobile">iPhone SE 1st Gen (320 × 568)</option>
          <option value="360x800" data-mode="mobile">Samsung Galaxy S22/S23 (360 × 800)</option>
          <option value="375x667" data-mode="mobile">iPhone 8 / SE 2/3 (375 × 667)</option>
          <option value="390x844" data-mode="mobile" selected>iPhone 14 / 15 (390 × 844)</option>
          <option value="412x915" data-mode="mobile">Google Pixel 7/8 (412 × 915)</option>
          <option value="430x932" data-mode="mobile">iPhone 15 Pro Max (430 × 932)</option>
        </optgroup>
        <optgroup label="Tablets">
          <option value="768x1024" data-mode="tablet">iPad Mini / 10.2" Portrait (768 × 1024)</option>
          <option value="820x1180" data-mode="tablet">iPad Air / Pro 11" (820 × 1180)</option>
          <option value="1024x768" data-mode="tablet">iPad Landscape (1024 × 768)</option>
        </optgroup>
        <optgroup label="Desktop & Laptops">
          <option value="1280x800" data-mode="desktop">MacBook Air 13" (1280 × 800)</option>
          <option value="1440x900" data-mode="desktop">MacBook Pro 15" (1440 × 900)</option>
          <option value="1920x1080" data-mode="desktop">1080p Desktop (1920 × 1080)</option>
        </optgroup>
      </select>

      <!-- Rotate Orientation Button -->
      <button class="tool-btn" onclick="toggleOrientation()">⟳ Rotate</button>

      <!-- Zoom Scale Toggle -->
      <select id="scaleSelect" class="preset-selector" onchange="applyZoomScale(this.value)">
        <option value="0.75">Scale: 75%</option>
        <option value="0.85">Scale: 85%</option>
        <option value="1" selected>Scale: 100%</option>
      </select>

      <!-- Current Dimensions Indicator -->
      <div id="statDisplay" class="viewport-stat">390 × 844 px</div>

      <!-- Automated Audit Button -->
      <button class="tool-btn primary" onclick="runInBrowserAudit()">⚡ Run All Viewports Audit</button>
    </div>
  </header>

  <!-- Viewport Preview Stage -->
  <main class="stage-container">
    <div id="frameWrapper" class="device-frame-wrapper" style="width: 390px; height: 844px;">
      <iframe id="previewFrame" src="index.html"></iframe>
    </div>
  </main>

  <!-- Automated Audit Modal Results -->
  <div id="auditOverlay" class="audit-overlay">
    <div class="audit-modal">
      <div class="audit-header">
        <div class="audit-title">📱 Full Viewport Matrix Audit Results</div>
        <button class="tool-btn" onclick="closeAuditModal()">✕ Close</button>
      </div>
      <div class="audit-body">
        <div id="auditSummaryBanner" style="margin-bottom: 1rem; font-weight: 700;"></div>
        <table class="audit-table">
          <thead>
            <tr>
              <th>Viewport Profile</th>
              <th>Dimensions</th>
              <th>Scroll Width</th>
              <th>Overflow</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="auditTableBody">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let currentWidth = 390;
    let currentHeight = 844;
    let isRotated = false;

    function applyDevicePreset(val) {
      const [w, h] = val.split('x').map(Number);
      currentWidth = isRotated ? h : w;
      currentHeight = isRotated ? w : h;
      updateFrameSize();
    }

    function toggleOrientation() {
      isRotated = !isRotated;
      const tmp = currentWidth;
      currentWidth = currentHeight;
      currentHeight = tmp;
      updateFrameSize();
    }

    function changePage(val) {
      document.getElementById('previewFrame').src = val;
    }

    function applyZoomScale(scale) {
      const wrapper = document.getElementById('frameWrapper');
      wrapper.style.transform = `scale(${scale})`;
      wrapper.style.transformOrigin = 'top center';
    }

    function updateFrameSize() {
      const wrapper = document.getElementById('frameWrapper');
      wrapper.style.width = `${currentWidth}px`;
      wrapper.style.height = `${currentHeight}px`;
      document.getElementById('statDisplay').innerText = `${currentWidth} × ${currentHeight} px`;

      if (currentWidth >= 1100) {
        wrapper.classList.add('desktop-mode');
      } else {
        wrapper.classList.remove('desktop-mode');
      }
    }

    const TEST_PROFILES = [
      { name: 'iPhone SE 1st Gen', w: 320, h: 568 },
      { name: 'Samsung Galaxy S22/S23', w: 360, h: 800 },
      { name: 'iPhone 8 / SE 2/3', w: 375, h: 667 },
      { name: 'iPhone 14 / 15', w: 390, h: 844 },
      { name: 'Google Pixel 7/8', w: 412, h: 915 },
      { name: 'iPhone 15 Pro Max', w: 430, h: 932 },
      { name: 'iPad Mini / 10.2"', w: 768, h: 1024 },
      { name: 'iPad Air / Pro 11"', w: 820, h: 1180 },
      { name: 'iPad Landscape', w: 1024, h: 768 },
      { name: 'MacBook Air 13"', w: 1280, h: 800 },
      { name: 'MacBook Pro 15"', w: 1440, h: 900 },
      { name: '1080p Desktop', w: 1920, h: 1080 }
    ];

    async function runInBrowserAudit() {
      const overlay = document.getElementById('auditOverlay');
      const tbody = document.getElementById('auditTableBody');
      const banner = document.getElementById('auditSummaryBanner');
      
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 2rem;">Running diagnostic matrix...</td></tr>';
      overlay.classList.add('active');

      const page = document.getElementById('pageSelect').value;
      const iframe = document.getElementById('previewFrame');
      const results = [];

      for (let p of TEST_PROFILES) {
        currentWidth = p.w;
        currentHeight = p.h;
        updateFrameSize();

        // Allow layout to settle
        await new Promise(r => setTimeout(r, 150));

        let scrollW = p.w;
        let hasOverflow = false;
        let delta = 0;

        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          if (doc) {
            scrollW = Math.max(doc.documentElement.scrollWidth, doc.body ? doc.body.scrollWidth : 0);
            delta = Math.max(0, scrollW - p.w);
            hasOverflow = delta > 1;
          }
        } catch (e) {
          // Cross-origin fallback
        }

        results.push({
          name: p.name,
          w: p.w,
          h: p.h,
          scrollW,
          delta,
          pass: !hasOverflow
        });
      }

      // Render table
      tbody.innerHTML = '';
      let passedCount = 0;

      results.forEach(r => {
        if (r.pass) passedCount++;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${r.name}</strong></td>
          <td><code>${r.w} × ${r.h}</code></td>
          <td><code>${r.scrollW}px</code></td>
          <td><code>+${r.delta}px</code></td>
          <td>
            <span class="status-badge ${r.pass ? 'pass' : 'fail'}">
              ${r.pass ? '✓ PASS' : '✕ FAIL'}
            </span>
          </td>
        `;
        tbody.appendChild(tr);
      });

      banner.innerHTML = `<span style="color: ${passedCount === results.length ? '#10b981' : '#ef4444'}; font-size: 1.1rem;">
        ${passedCount}/${results.length} Profiles Passed (${Math.round((passedCount/results.length)*100)}% Pass Rate)
      </span> on <code>${page}</code>`;
    }

    function closeAuditModal() {
      document.getElementById('auditOverlay').classList.remove('active');
    }
  </script>
</body>
</html>
