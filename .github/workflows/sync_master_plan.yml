name: Sync Master Plan to Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'training_data.json'
      - 'scripts/sync_plan_to_supabase.js'
  workflow_dispatch:

jobs:
  sync-plan:
    name: Sync Master Plan to Supabase Cloud DB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Master Plan Cloud Synchronizer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node scripts/sync_plan_to_supabase.js
